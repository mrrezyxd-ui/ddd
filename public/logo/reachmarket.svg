<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="rm-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="rm-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="rm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#EF4444" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Icon Mark: Hexagonal Tech Shield with Dynamic 'R' and 'M' geometric arrows -->
  <g transform="translate(10, 10)">
    <!-- Base Hexagon -->
    <path d="M30 0 L56 15 L56 45 L30 60 L4 45 L4 15 Z" fill="url(#rm-dark-grad)" stroke="#3F3F46" stroke-width="2"/>
    
    <!-- Red Angular Stylized R/M Wing -->
    <path d="M16 16 L30 8 L44 16 L44 32 L34 26 L34 20 L24 20 L24 44 L16 40 Z" fill="url(#rm-red-grad)" filter="url(#rm-glow)"/>
    <!-- Red Dynamic Arrow / Diamond Node -->
    <path d="M34 32 L44 42 L34 46 L30 38 Z" fill="#F87171"/>
    <!-- Cyber Center Dot -->
    <circle cx="30" cy="30" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(80, 22)">
    <text x="0" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" letter-spacing="-0.03em" fill="#FFFFFF">
      REACH<tspan fill="#EF4444">MARKET</tspan>
    </text>
    <text x="2" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" letter-spacing="0.25em" fill="#A1A1AA">
      DIGITAL GOODS PLATFORM
    </text>
  </g>
</svg>
